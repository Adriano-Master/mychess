<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img">
  <title>MyChess 02: livro-tabuleiro</title>
  <defs>
    <clipPath id="pagina"><rect width="176" height="220" rx="6"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#1b1d20"/>
  <!-- capa -->
  <path d="M62 150L256 184L450 150V392L256 428L62 392Z" fill="#2e3238"/>
  <path d="M62 150L256 184L450 150V392L256 428L62 392Z" fill="none" stroke="#7cc04a" stroke-width="14" stroke-linejoin="round"/>
  <!-- página esquerda: um tabuleiro 4x4 -->
  <g transform="matrix(1 .17 0 1 80 150)" clip-path="url(#pagina)">
    <rect width="176" height="220" fill="#e8eaed"/>
    <g fill="#7cc04a">
      <rect x="44" y="0" width="44" height="55"/><rect x="132" y="0" width="44" height="55"/>
      <rect x="0" y="55" width="44" height="55"/><rect x="88" y="55" width="44" height="55"/>
      <rect x="44" y="110" width="44" height="55"/><rect x="132" y="110" width="44" height="55"/>
      <rect x="0" y="165" width="44" height="55"/><rect x="88" y="165" width="44" height="55"/>
    </g>
  </g>
  <!-- página direita: o mesmo tabuleiro, invertido -->
  <g transform="matrix(1 -.17 0 1 256 180)" clip-path="url(#pagina)">
    <rect width="176" height="220" fill="#e8eaed"/>
    <g fill="#7cc04a">
      <rect x="0" y="0" width="44" height="55"/><rect x="88" y="0" width="44" height="55"/>
      <rect x="44" y="55" width="44" height="55"/><rect x="132" y="55" width="44" height="55"/>
      <rect x="0" y="110" width="44" height="55"/><rect x="88" y="110" width="44" height="55"/>
      <rect x="44" y="165" width="44" height="55"/><rect x="132" y="165" width="44" height="55"/>
    </g>
  </g>
  <!-- lombada -->
  <path d="M256 184V400" stroke="#1b1d20" stroke-width="10"/>
  <!-- marcador de página -->
  <path d="M300 168V108H352V168L326 150Z" fill="#1b1d20" stroke="#e8eaed" stroke-width="8" stroke-linejoin="round"/>
</svg>
