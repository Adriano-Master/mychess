# Portão de qualidade nas três plataformas suportadas. Espelha `cargo xtask ci`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Instala o toolchain fixado em rust-toolchain.toml (com rustfmt e clippy).
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  lint:
    name: Clippy e arquitetura (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # ALSA para o `cpal`/`rodio` (sons, ADR 0013); só o Linux precisa.
      - name: Dependências de áudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo xtask arch

  test:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # ALSA para o `cpal`/`rodio` (sons, ADR 0013); só o Linux precisa.
      - name: Dependências de áudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo test --workspace --all-features --locked --doc
      # Benchmarks só compilam aqui (não executam); medições em docs/benchmarks.md.
      - run: cargo bench --workspace --all-features --locked --no-run

  docs:
    name: Documentação
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      # ALSA para o `cpal`/`rodio` (sons, ADR 0013).
      - name: Dependências de áudio
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items --locked

  testes-lentos:
    name: Testes lentos (perft profundo, fluxo de 200 MB)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ALSA para o `cpal`/`rodio` (sons, ADR 0013).
      - name: Dependências de áudio
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Os `compat_*` precisam de `reference/` (fora do git) e ficam de fora; os
      # `real_*` do `mychess-tablebase` precisam de tabelas Syzygy reais
      # (`MYCHESS_TEST_SYZYGY`, ver o README) e também.
      - run: cargo test --workspace --all-features --locked --release -- --ignored --skip compat_ --skip real_

  deny:
    name: Licenças e vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
