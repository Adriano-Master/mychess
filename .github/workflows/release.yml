# Gera os pacotes de distribuição (Linux e Windows) com o mesmo script usado
# localmente (packaging/build-dist.sh) e publica numa Release quando se empurra
# uma tag `v*`. Também roda manualmente (workflow_dispatch): então só gera os
# pacotes como artefatos.
#
# As bases de dados do pacote não estão no repositório fora de dist/: este
# fluxo as extrai do pacote Linux já versionado em dist/ (veja
# packaging/README.md). Sem ele, o job falha com uma mensagem clara.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Pacote (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Dependências de áudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Reúne as bases a partir do pacote Linux versionado
        run: |
          set -euo pipefail
          archive="$(ls dist/MyChess-*-linux-x86_64.tar.gz | head -n 1)"
          mkdir -p "$RUNNER_TEMP/unpack" "$RUNNER_TEMP/data/Data Base/openings"
          tar xzf "$archive" -C "$RUNNER_TEMP/unpack"
          src="$(ls -d "$RUNNER_TEMP"/unpack/MyChess-*/MyChess/Databases)"
          cp "$src"/Capablanca.* "$src"/Carlsen.* "$RUNNER_TEMP/data/"
          cp "$src"/SicilianNajdorf6Bg5.pgn "$RUNNER_TEMP/data/Data Base/openings/"
          mkdir -p "$RUNNER_TEMP/data/Engines/Stockfish"
          cp "$src"/../Engine/stockfish/{stockfish_10_x64_modern_official,stockfish-10-src.zip,Readme.md,compileinfo.txt} "$RUNNER_TEMP/data/Engines/Stockfish/"
      - name: Gera o pacote
        env:
          DATA_DIR: ${{ runner.temp }}/data
          NATIVE_WINDOWS: ${{ matrix.target == 'windows' && '1' || '0' }}
          VERSION: ${{ vars.PACKAGE_VERSION || '0.1.0-alpha' }}
        run: packaging/build-dist.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: pacote-${{ matrix.target }}
          path: |
            dist/MyChess-*-${{ matrix.target }}-*.tar.gz
            dist/MyChess-*-${{ matrix.target }}-*.zip

  publish:
    name: Publica a Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: pacotes
          merge-multiple: true
      - name: SHA256SUMS.txt
        run: cd pacotes && sha256sum MyChess-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: pacotes/*
          prerelease: true
